    nulo: false
  - nome: distribution_channel_vtweg
    tipo: string
    comentario: "Canal de distribuicao (VTWEG)"
    pii: nenhum
    nulo: false
  - nome: language_key_spras
    tipo: string
    comentario: "Chave de idioma (SPRAS)"
    pii: nenhum
    nulo: false
  - nome: name_vtext
    tipo: string
    comentario: "Nome do canal de distribuicao"
    pii: nenhum
    nulo: true
  - nome: source_last_updated_at
    tipo: timestamp
    comentario: "Data/hora da ultima atualizacao na fonte"
    pii: nenhum
    nulo: true
  - nome: bq_loaded_at
    tipo: timestamp
    comentario: "Data/hora de carga no BigQuery"
    pii: nenhum
    nulo: true

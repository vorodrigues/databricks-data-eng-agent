tabela: distribution_channels
camada: gold
comentario: "Dicionario mestre de canais de distribuicao do SAP TVTW, enriquecido com nomes multilinguagem de TVTWT."
entidade: obt              # tabela larga denormalizada (one-big-table)
ingestao: custom
fontes: [silver.tvko, silver.tvkot, silver.tvtw, silver.tvtwt, silver.tspa, silver.tspat]   # tabelas SAP de origem (join custom no transform)

tabela: languages
camada: gold
comentario: "Dicionario de idiomas do SAP T002/T002T, mapeando chaves de idioma a nomes padronizados para suporte a relatorios multilinguagem."
entidade: obt              # tabela larga denormalizada (one-big-table)
ingestao: custom
fontes: [silver.t001, silver.t002, silver.t002t, silver.t005, silver.t005t, silver.t005k, silver.t005s, silver.t005u, silver.tj02t]   # tabelas SAP de origem (join custom no transform)
chave_primaria: [language_key_spras, description_language_sprsl]
colunas:
  - nome: language_key_spras
    tipo: string
    comentario: "Chave de idioma (SPRAS)"
    pii: nenhum
    nulo: false
  - nome: iso_code_laiso
    tipo: string
    comentario: "Codigo ISO do idioma (LAISO)"
    pii: nenhum
    nulo: true
  - nome: description_language_sprsl
    tipo: string
    comentario: "Idioma de descricao (SPRSL)"
    pii: nenhum
    nulo: false
  - nome: language_name_sptxt
    tipo: string
    comentario: "Nome do idioma"
    pii: nenhum
    nulo: true
  - nome: source_last_updated_at
    tipo: timestamp
    comentario: "Data/hora da ultima atualizacao na fonte"
    pii: nenhum
    nulo: true
  - nome: bq_loaded_at
    tipo: timestamp
    comentario: "Data/hora de carga no BigQuery"
    pii: nenhum
    nulo: true
